name: deploy

on:
  push:
    branches: [ "main" ]
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: ftp-deploy
        uses: SamKirkland/FTP-Deploy-Action@v4.4.0
        with:
          server: fn555.xsph.ru
          username: fn555
          password: ${{ secrets.FTP_PASSWORD }}
          server-dir: ./domains/fn555.xsph.ru/public_html/web/
